version: '3.9'

services:

  # ── PHP + Apache ─────────────────────────────────────────────
  app:
    build: .
    container_name: ecoride_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - mongodb
    environment:
      DB_HOST: mysql
      DB_NAME: ecoride
      DB_USER: ecoride
      DB_PASS: ecoride_pass
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: ecoride_stats
    networks:
      - ecoride_net

  # ── MySQL ─────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: ecoride_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: ecoride
      MYSQL_USER: ecoride
      MYSQL_PASSWORD: ecoride_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    networks:
      - ecoride_net

  # ── MongoDB ───────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: ecoride_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ecoride_net

  # ── phpMyAdmin (optionnel, dev) ───────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ecoride_pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: ecoride
      PMA_PASSWORD: ecoride_pass
    depends_on:
      - mysql
    networks:
      - ecoride_net

volumes:
  mysql_data:
  mongo_data:

networks:
  ecoride_net:
    driver: bridge
