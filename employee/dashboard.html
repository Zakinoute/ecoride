<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Employé – EcoRide</title>
  <style>
:root{--primary:#2E7D32;--primary-light:#4CAF50;--primary-lighter:#81C784;--primary-pale:#C8E6C9;--accent:#8BC34A;--eco-badge:#00897B;--background:#F1F8E9;--surface:#FFFFFF;--surface-alt:#F9FBF7;--text-primary:#1B5E20;--text-secondary:#388E3C;--text-muted:#78909C;--text-dark:#263238;--warning:#F57C00;--error:#C62828;--border:#C8E6C9;--shadow:rgba(46,125,50,0.12);--shadow-md:rgba(46,125,50,0.20);--radius:10px;--radius-sm:6px;--radius-lg:16px;--transition:all 0.2s ease;--font:'Segoe UI',system-ui,-apple-system,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth;font-size:16px}body{font-family:var(--font);background:var(--background);color:var(--text-dark);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}img{max-width:100%;height:auto;display:block}a{color:var(--primary);text-decoration:none;transition:var(--transition)}a:hover{color:var(--primary-light)}ul{list-style:none}button,input,select,textarea{font-family:inherit}
.site-header{background:var(--primary);box-shadow:0 2px 8px var(--shadow-md);position:sticky;top:0;z-index:1000}.nav-container{max-width:1200px;margin:0 auto;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:64px}.nav-logo{display:flex;align-items:center;gap:.5rem;color:#fff;font-size:1.4rem;font-weight:700}.nav-links{display:flex;align-items:center;gap:.25rem}.nav-links a{color:rgba(255,255,255,.88);padding:.4rem .85rem;border-radius:var(--radius-sm);font-size:.95rem;font-weight:500;transition:var(--transition)}.nav-links a:hover{color:#fff;background:rgba(255,255,255,.18)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.65rem 1.4rem;border-radius:var(--radius-sm);font-size:.95rem;font-weight:600;cursor:pointer;transition:var(--transition);border:2px solid transparent;white-space:nowrap;text-decoration:none}.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn-primary:hover{background:var(--primary-light);border-color:var(--primary-light);color:#fff}.btn-outline{background:transparent;color:var(--primary);border-color:var(--primary)}.btn-outline:hover{background:var(--primary);color:#fff}.btn-danger{background:var(--error);color:#fff;border-color:var(--error)}.btn-danger:hover{background:#B71C1C}.btn-sm{padding:.4rem .9rem;font-size:.85rem}.btn:disabled{opacity:.5;cursor:not-allowed}.w-full{width:100%}
.badge{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .6rem;border-radius:20px;font-size:.78rem;font-weight:600}.badge-active{background:#E8F5E9;color:var(--primary)}.badge-started{background:#FFF8E1;color:#E65100}.badge-completed{background:#E3F2FD;color:#1565C0}.badge-cancelled{background:#FFEBEE;color:var(--error)}.badge-pending{background:#FFF9C4;color:#F57F17}.badge-approved{background:#E8F5E9;color:var(--primary)}.badge-rejected{background:#FFEBEE;color:var(--error)}
.alert{padding:.85rem 1.25rem;border-radius:var(--radius-sm);font-size:.95rem;margin-bottom:1rem;display:flex;align-items:center;gap:.75rem}.alert-success{background:#E8F5E9;color:#1B5E20;border-left:4px solid var(--primary)}.alert-error{background:#FFEBEE;color:#B71C1C;border-left:4px solid var(--error)}
.text-center{text-align:center}.text-muted{color:var(--text-muted)}.hidden{display:none!important}.mb-2{margin-bottom:1rem}.mb-3{margin-bottom:1.5rem}.empty-state{text-align:center;padding:3rem 1rem;color:var(--text-muted)}.empty-state .icon{font-size:3rem;margin-bottom:1rem}.empty-state h3{margin-bottom:.5rem;color:var(--text-secondary)}
.dashboard-layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 64px)}@media(max-width:900px){.dashboard-layout{grid-template-columns:1fr}.sidebar{display:none}.sidebar.open{display:flex}}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:1.5rem 0;display:flex;flex-direction:column;position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto}.sidebar-user{padding:0 1.25rem 1.25rem;border-bottom:1px solid var(--border);margin-bottom:1rem}.sidebar-user .avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid var(--primary-pale);margin-bottom:.6rem}.sidebar-user .name{font-weight:700;font-size:1rem;color:var(--text-primary)}.sidebar-user .role{font-size:.8rem;color:var(--text-muted);text-transform:capitalize}
.sidebar-nav{flex:1}.sidebar-nav-section{padding:.5rem 1.25rem;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-top:.5rem}.sidebar-nav a{display:flex;align-items:center;gap:.75rem;padding:.65rem 1.25rem;color:var(--text-dark);font-size:.93rem;font-weight:500;transition:all .15s;border-left:3px solid transparent}.sidebar-nav a:hover{background:var(--background);color:var(--primary)}.sidebar-nav a.active{background:var(--background);color:var(--primary);border-left-color:var(--primary);font-weight:600}.sidebar-nav a .nav-icon{font-size:1.15rem;width:22px;text-align:center}.sidebar-logout{padding:1.25rem;border-top:1px solid var(--border);margin-top:auto}
.dashboard-main{padding:2rem;overflow-y:auto;background:var(--background)}@media(max-width:640px){.dashboard-main{padding:1rem}}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem}.page-header h1{font-size:1.6rem;font-weight:800;color:var(--primary)}.page-header .breadcrumb{font-size:.85rem;color:var(--text-muted);margin-top:.15rem}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1.25rem;margin-bottom:2rem}.stat-card{background:var(--surface);border-radius:var(--radius);padding:1.5rem;border:1px solid var(--border);box-shadow:0 2px 8px var(--shadow);display:flex;align-items:center;gap:1rem}.stat-icon{width:48px;height:48px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}.stat-icon.green{background:#E8F5E9}.stat-icon.teal{background:#E0F2F1}.stat-icon.amber{background:#FFF8E1}.stat-icon.blue{background:#E3F2FD}.stat-value{font-size:1.8rem;font-weight:800;color:var(--primary);line-height:1}.stat-label{font-size:.82rem;color:var(--text-muted);margin-top:.2rem}
.data-table{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);box-shadow:0 2px 8px var(--shadow);overflow:hidden}.data-table-header{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);background:var(--surface-alt);flex-wrap:wrap;gap:.75rem}.data-table-header h3{color:var(--primary);font-size:1rem}.data-table table{width:100%;border-collapse:collapse}.data-table th{background:var(--background);padding:.75rem 1rem;text-align:left;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-secondary);border-bottom:1px solid var(--border)}.data-table td{padding:.85rem 1rem;border-bottom:1px solid var(--border);font-size:.9rem;vertical-align:middle}.data-table tr:last-child td{border-bottom:none}.data-table tr:hover td{background:var(--background)}.data-table-scroll{overflow-x:auto}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:2rem}.tab-btn{padding:.75rem 1.5rem;background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;font-size:.93rem;font-weight:600;color:var(--text-muted);transition:var(--transition)}.tab-btn:hover{color:var(--primary)}.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}.tab-content{display:none}.tab-content.active{display:block}
.notif-dot{display:inline-block;width:8px;height:8px;background:var(--warning);border-radius:50%;margin-left:4px;vertical-align:middle}
  </style>
</head>
<body>

<header class="site-header">
  <nav class="nav-container">
    <a href="../index.html" class="nav-logo"><span class="leaf-icon">🌿</span> EcoRide</a>
    <ul class="nav-links">
      <li><span style="color:rgba(255,255,255,.8);font-size:.85rem">👷 Espace Employé</span></li>
      <li><a href="#" class="logout-btn" data-base="../">Déconnexion</a></li>
    </ul>
  </nav>
</header>

<div class="dashboard-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-user">
      <img src="../assets/avatars/default-avatar.png" class="avatar">
      <div class="name" id="sidebarPseudo">—</div>
      <div class="role">Employé</div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-nav-section">Modération</div>
      <a href="dashboard.html" class="active"><span class="nav-icon">🏠</span> Tableau de bord</a>
      <a href="#" id="linkReviews" onclick="showTab('reviews')"><span class="nav-icon">⭐</span> Avis à valider <span class="notif-dot" id="reviewsDot"></span></a>
      <a href="#" id="linkReported" onclick="showTab('reported')"><span class="nav-icon">⚠️</span> Trajets signalés <span class="notif-dot" id="reportedDot"></span></a>
      <div class="sidebar-nav-section">Navigation</div>
      <a href="../index.html"><span class="nav-icon">🌿</span> Site public</a>
    </nav>
    <div class="sidebar-logout">
      <a href="#" class="btn btn-outline w-full logout-btn" data-base="../">Déconnexion</a>
    </div>
  </aside>

  <main class="dashboard-main">
    <div class="page-header">
      <div><h1>Espace Employé</h1><div class="breadcrumb">Modération des avis et des trajets signalés</div></div>
    </div>

    <div id="globalAlert"></div>

    <!-- Stats rapides -->
    <div class="stats-grid mb-3">
      <div class="stat-card">
        <div class="stat-icon amber">⭐</div>
        <div>
          <div class="stat-value" id="statPending">—</div>
          <div class="stat-label">Avis en attente</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#FFEBEE">⚠️</div>
        <div>
          <div class="stat-value" id="statReported">—</div>
          <div class="stat-label">Trajets signalés</div>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="reviews" onclick="showTab('reviews')">⭐ Avis à valider</button>
      <button class="tab-btn" data-tab="reported" onclick="showTab('reported')">⚠️ Trajets signalés</button>
    </div>

    <!-- ====================================================== -->
    <!-- Avis à valider                                         -->
    <!-- ====================================================== -->
    <div class="tab-content active" id="tab-reviews">
      <div id="reviewsList">
        <div class="text-center text-muted">Chargement…</div>
      </div>
    </div>

    <!-- ====================================================== -->
    <!-- Trajets signalés                                       -->
    <!-- ====================================================== -->
    <div class="tab-content" id="tab-reported">
      <div id="reportedList">
        <div class="text-center text-muted">Chargement…</div>
      </div>
    </div>
  </main>
</div>

<script src="../js/main.js"></script>
<script>
window.API_BASE = '../php/';
document.addEventListener('DOMContentLoaded', async () => {
  const user = EcoRide.getAuthState();
  if (!user || (user.role !== 'employee' && user.role !== 'admin')) {
    window.location.href = '../login.html';
    return;
  }
  document.getElementById('sidebarPseudo').textContent = user.pseudo;

  // Stats
  const stats = await EcoRide.apiRequest('../php/employee.php', 'GET', { action: 'stats' });
  if (stats.success) {
    document.getElementById('statPending').textContent  = stats.pending_reviews;
    document.getElementById('statReported').textContent = stats.reported_trips;
    if (stats.pending_reviews  > 0) document.getElementById('reviewsDot').style.display  = 'inline-block';
    if (stats.reported_trips   > 0) document.getElementById('reportedDot').style.display = 'inline-block';
  }

  // Charger les avis
  await loadReviews();
  await loadReportedTrips();
});

function showTab(tabName) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector(`[data-tab="${tabName}"]`)?.classList.add('active');
  document.getElementById('tab-' + tabName)?.classList.add('active');
}

async function loadReviews() {
  const data = await EcoRide.apiRequest('../php/reviews.php', 'GET', { action: 'pending' });
  const div  = document.getElementById('reviewsList');
  if (!data.success) { div.innerHTML = '<div class="alert alert-error">Erreur de chargement.</div>'; return; }

  if (data.reviews.length === 0) {
    div.innerHTML = '<div class="empty-state"><div class="icon">✅</div><h3>Aucun avis en attente</h3><p>Tous les avis ont été traités.</p></div>';
    return;
  }

  div.innerHTML = `
    <div class="data-table">
      <div class="data-table-header">
        <h3>⭐ Avis en attente de validation</h3>
        <span class="text-muted" style="font-size:.85rem">${data.reviews.length} avis</span>
      </div>
      <div class="data-table-scroll">
        <table>
          <thead>
            <tr>
              <th>Auteur</th><th>Conducteur</th><th>Trajet</th><th>Note</th><th>Commentaire</th><th>Date</th><th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${data.reviews.map(r => `
              <tr>
                <td><strong>${r.reviewer_pseudo}</strong></td>
                <td>${r.driver_pseudo}</td>
                <td>${r.departure_city} → ${r.arrival_city}<br><small>${EcoRide.formatDate(r.departure_datetime)}</small></td>
                <td>${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</td>
                <td style="max-width:200px">${r.comment || '<em class="text-muted">Aucun commentaire</em>'}</td>
                <td>${EcoRide.formatDate(r.created_at)}</td>
                <td>
                  <div style="display:flex;gap:.5rem">
                    <button class="btn btn-sm btn-primary approve-btn" data-id="${r.id}">✅ Valider</button>
                    <button class="btn btn-sm btn-danger reject-btn" data-id="${r.id}">❌ Refuser</button>
                  </div>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;

  div.querySelectorAll('.approve-btn').forEach(btn => {
    btn.addEventListener('click', () => moderateReview(btn.dataset.id, 'approved'));
  });
  div.querySelectorAll('.reject-btn').forEach(btn => {
    btn.addEventListener('click', () => moderateReview(btn.dataset.id, 'rejected'));
  });
}

async function moderateReview(id, decision) {
  const res = await EcoRide.apiRequest('../php/reviews.php', 'POST', { action: 'moderate', review_id: id, decision });
  EcoRide.showAlert(document.getElementById('globalAlert'), res.success ? 'success' : 'error', res.message);
  if (res.success) loadReviews();
}

async function loadReportedTrips() {
  const data = await EcoRide.apiRequest('../php/employee.php', 'GET', { action: 'reported_trips' });
  const div  = document.getElementById('reportedList');
  if (!data.success) { div.innerHTML = '<div class="alert alert-error">Erreur de chargement.</div>'; return; }

  if (data.trips.length === 0) {
    div.innerHTML = '<div class="empty-state"><div class="icon">✅</div><h3>Aucun trajet signalé</h3><p>Aucun incident à traiter.</p></div>';
    return;
  }

  div.innerHTML = `
    <div class="data-table">
      <div class="data-table-header">
        <h3>⚠️ Trajets signalés comme "mal passés"</h3>
      </div>
      <div class="data-table-scroll">
        <table>
          <thead>
            <tr><th>Trajet</th><th>Date</th><th>Conducteur</th><th>Passagers</th><th>Raison du signalement</th><th>Statut</th></tr>
          </thead>
          <tbody>
            ${data.trips.map(t => `
              <tr>
                <td><strong>${t.departure_city} → ${t.arrival_city}</strong></td>
                <td>${EcoRide.formatDate(t.departure_datetime)}</td>
                <td>
                  ${t.driver_pseudo}<br>
                  <small class="text-muted">${t.driver_email}</small>
                </td>
                <td style="max-width:150px;font-size:.85rem">${t.passengers || '<em>Aucun</em>'}</td>
                <td style="max-width:200px;font-size:.85rem">${t.report_reason || '—'}</td>
                <td><span class="badge badge-${t.status}">${t.status}</span></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}
</script>
</body>
</html>
